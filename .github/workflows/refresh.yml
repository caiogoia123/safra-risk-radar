name: Weekly refresh

# Re-runs the whole pipeline and commits the dashboard's data.
#
# Two jobs in one, on purpose:
#   1. keeps the published app current -- CONAB revises its survey monthly and
#      NASA POWER adds days continuously;
#   2. keeps BigQuery alive -- sandbox tables expire after 60 days, and every
#      `dbt build` recreates them, resetting the clock.
on:
  schedule:
    # Mondays 06:00 UTC (03:00 in Brazil).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DUCKDB_PATH: ../data/dev.duckdb
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCP_KEYFILE: ${{ github.workspace }}/gcp-key.json
      # Secrets are unavailable to forks, and absent until they are configured,
      # so the BigQuery half is conditional rather than assumed.
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Extract and load into DuckDB
        # A clean runner has no raw cache, so this fetches CONAB fresh and then
        # makes one NASA POWER request per grid cell -- 255 of them, and the long
        # pole of the whole workflow. POWER throttles datacenter IPs, so the
        # first attempt at this ran past 59 minutes and was killed; the cells are
        # now fetched five at a time.
        #
        # The municipal PAM table and the hub centroids are NOT downloaded here:
        # both IBGE APIs refuse datacenter IPs, and both datasets are static, so
        # they are versioned under ingestion/reference/ and regenerated on
        # purpose. That is what took the run from 59 minutes to under four.
        #
        # -u because without it Python block-buffers stdout when it is not a
        # terminal: the progress lines sit in the buffer for the whole run, and
        # a step that prints nothing for an hour is indistinguishable from a hang.
        run: python -u -m ingestion --target dev

      - name: Build and test the dbt project (dev)
        working-directory: dbt
        run: dbt build --target dev --profiles-dir .

      - name: Write the service account key
        if: env.HAS_GCP == 'true'
        env:
          # Through the environment rather than interpolated into the script:
          # the key never becomes shell text that quoting could break or inject.
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$KEY" > "$GCP_KEYFILE"

      - name: Load into BigQuery
        if: env.HAS_GCP == 'true'
        run: python -m ingestion --target prod

      - name: Build and test the dbt project (prod)
        if: env.HAS_GCP == 'true'
        working-directory: dbt
        run: dbt build --target prod --profiles-dir .

      - name: Remove the key
        if: always()
        run: rm -f "$GCP_KEYFILE"

      - name: Export the dashboard data
        # Reads DuckDB, so it does not depend on the BigQuery half succeeding.
        run: python -m analysis.export_app_data

      - name: Commit if the data moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data
          if git diff --staged --quiet; then
            echo "No change in the exported data."
          else
            git commit -m "Refresh dashboard data [skip ci]"
            git push
          fi
